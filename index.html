<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CallSubs</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>

<section id="home" class="screen">
  <div class="home-inner">
    <img src="icon-192.png" alt="" class="logo" width="72" height="72">
    <h1>CallSubs</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button id="btnNew" class="primary" data-i18n="newCall"></button>
    <button id="btnJoin" class="primary" hidden data-i18n="joinCall"></button>
    <div id="homeWarn" class="warn" hidden></div>
    <p id="homeTr" class="tagline small-note" hidden></p>
  </div>
</section>

<section id="call" class="screen" hidden>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>

  <div id="status" class="status" hidden></div>
  <div id="subStatus" class="substatus" hidden></div>

  <div id="shareCard" class="card" hidden>
    <div class="card-title" data-i18n="shareTitle"></div>
    <div id="shareLink" class="link"></div>
    <div class="row">
      <button id="btnShare" class="primary" data-i18n="share"></button>
      <button id="btnCopy" class="secondary" data-i18n="copy"></button>
    </div>
  </div>

  <div id="notice" class="notice" hidden>
    <span id="noticeText"></span>
    <button id="noticeAction" class="secondary" hidden></button>
  </div>
  <button id="btnUnmute" class="primary floating" hidden data-i18n="tapSound"></button>
  <button id="btnReconnect" class="primary floating" hidden data-i18n="reconnect"></button>

  <div id="subs">
    <div id="lines"></div>
    <div id="liveThem" class="live them" hidden></div>
    <div id="liveMe" class="live me" hidden></div>
  </div>

  <div id="controls">
    <button id="btnMic" class="ctl" aria-label="Microphone">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg><span class="lbl" data-i18n="lblMic"></span>
    </button>
    <button id="btnCam" class="ctl" aria-label="Camera">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg><span class="lbl" data-i18n="lblCam"></span>
    </button>
    <button id="btnPtt" class="ptt" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      <span data-i18n="holdToTalk"></span>
    </button>
    <button id="btnEnd" class="ctl end" aria-label="End call">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.96.96 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg><span class="lbl" data-i18n="lblEnd"></span>
    </button>
    <button id="btnDiag" class="ctl" aria-label="Diagnostics">
      <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg><span class="lbl" data-i18n="lblInfo"></span>
    </button>
  </div>

  <div id="diag" hidden>
    <div class="diag-head">
      <strong>Diagnostics</strong>
      <button id="diagClose" class="secondary small">Close</button>
    </div>
    <div class="diag-actions">
      <button id="dRestart" class="secondary small">Restart recognition</button>
      <button id="dFixMic" class="secondary small">Fix mic</button>
      <button id="dMode" class="secondary small">Mode: continuous</button>
      <button id="dTrack" class="secondary small">Track input: on</button>
      <button id="dCopy" class="secondary small">Copy report</button>
    </div>
    <table class="diag-table"></table>
    <pre class="diag-log"></pre>
  </div>
</section>

<section id="ended" class="screen" hidden>
  <div class="home-inner">
    <h1 id="endedTitle"></h1>
    <p id="endedText" class="tagline"></p>
    <button id="btnAgain" class="primary"></button>
  </div>
</section>

</body>
</html>
